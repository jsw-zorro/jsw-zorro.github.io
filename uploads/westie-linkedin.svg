<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- West Highland White Terrier: round groomed face, small high-set ears -->
  <g transform="translate(12, 13.2)">
    <!-- Small erect ears set HIGH on top, close to crown -->
    <path d="M-4.6,-9.6 L-2.6,-6.4 L-6.0,-5.6 Z" fill="white" stroke="#CFCFCF" stroke-width="0.35" stroke-linejoin="round"/>
    <path d="M4.6,-9.6 L2.6,-6.4 L6.0,-5.6 Z" fill="white" stroke="#CFCFCF" stroke-width="0.35" stroke-linejoin="round"/>
    <path d="M-4.4,-8.4 L-3.3,-6.6 L-5.2,-6.2 Z" fill="#F0BFBF"/>
    <path d="M4.4,-8.4 L3.3,-6.6 L5.2,-6.2 Z" fill="#F0BFBF"/>
    <!-- Round chrysanthemum face: very circular, fluffy scalloped edge -->
    <path d="M0,-6.9
             Q-1.9,-6.9 -3.3,-6.1
             Q-5.2,-6.0 -6.2,-4.5
             Q-7.6,-3.5 -7.5,-1.7
             Q-8.2,0.1 -7.3,1.8
             Q-7.2,3.6 -5.6,4.6
             Q-4.7,6.2 -2.8,6.4
             Q-1.5,7.3 0,7.3
             Q1.5,7.3 2.8,6.4
             Q4.7,6.2 5.6,4.6
             Q7.2,3.6 7.3,1.8
             Q8.2,0.1 7.5,-1.7
             Q7.6,-3.5 6.2,-4.5
             Q5.2,-6.0 3.3,-6.1
             Q1.9,-6.9 0,-6.9 Z"
          fill="white" stroke="#D8D8D8" stroke-width="0.35" stroke-linejoin="round"/>
    <!-- Fringe over forehead (Westie topknot) -->
    <path d="M-2.6,-5.4 Q-1.3,-6.2 0,-5.6 Q1.3,-6.2 2.6,-5.4" fill="none" stroke="#E3E3E3" stroke-width="0.4" stroke-linecap="round"/>
    <path d="M-1.4,-4.9 Q0,-5.6 1.4,-4.9" fill="none" stroke="#EBEBEB" stroke-width="0.35" stroke-linecap="round"/>
    <!-- Big sparkly wide-set eyes -->
    <circle cx="-2.6" cy="-1.4" r="1.05" fill="#26221F"/>
    <circle cx="2.6" cy="-1.4" r="1.05" fill="#26221F"/>
    <circle cx="-2.25" cy="-1.8" r="0.36" fill="white"/>
    <circle cx="2.95" cy="-1.8" r="0.36" fill="white"/>
    <circle cx="-2.95" cy="-1.05" r="0.16" fill="white" opacity="0.8"/>
    <circle cx="2.25" cy="-1.05" r="0.16" fill="white" opacity="0.8"/>
    <!-- Black button nose -->
    <path d="M-0.9,0.6 Q0,0.15 0.9,0.6 Q0.95,1.5 0,1.85 Q-0.95,1.5 -0.9,0.6 Z" fill="#26221F"/>
    <ellipse cx="-0.28" cy="0.72" rx="0.24" ry="0.16" fill="white" opacity="0.85"/>
    <!-- Smile -->
    <path d="M0,1.85 L0,2.45 M-1.15,2.6 Q-0.6,3.35 0,2.65 Q0.6,3.35 1.15,2.6" fill="none" stroke="#26221F" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tongue -->
    <path d="M-0.45,3.0 Q0,3.95 0.45,3.0 Q0.22,2.85 0,3.0 Q-0.22,2.85 -0.45,3.0 Z" fill="#F5928F"/>
    <!-- Fluffy beard strokes (chrysanthemum ruff) -->
    <path d="M-3.4,4.3 Q-1.7,5.7 0,5.4 Q1.7,5.7 3.4,4.3" fill="none" stroke="#E3E3E3" stroke-width="0.35" stroke-linecap="round"/>
    <path d="M-2.0,5.8 Q0,6.7 2.0,5.8" fill="none" stroke="#EBEBEB" stroke-width="0.3" stroke-linecap="round"/>
    <!-- Side cheek fluff -->
    <path d="M-6.9,-0.4 Q-7.6,0.6 -7.0,1.7 M6.9,-0.4 Q7.6,0.6 7.0,1.7" fill="none" stroke="#E3E3E3" stroke-width="0.35" stroke-linecap="round"/>
    <!-- Soft blush -->
    <ellipse cx="-4.7" cy="0.9" rx="1.2" ry="0.65" fill="#FFCFCF" opacity="0.65"/>
    <ellipse cx="4.7" cy="0.9" rx="1.2" ry="0.65" fill="#FFCFCF" opacity="0.65"/>
  </g>
</svg>
